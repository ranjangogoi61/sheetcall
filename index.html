<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>SheetCall</title>
<style>
  :root{
    --bg:#0f1115; --shell:#12161d; --card:#1a1d24; --sunk:#141922;
    --line:#2b313b; --line2:#303846;
    --ink:#ffffff; --dim:#9aa4b2; --dim2:#6b7280;
    --accent:#18b8a3; --accent-ink:#062e29;
  }
  *{box-sizing:border-box}
  body{
    margin:0;background:var(--bg);color:var(--ink);
    font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
    -webkit-text-size-adjust:100%;
  }
  .phone{
    max-width:430px;margin:20px auto;border:2px solid #2a2f38;border-radius:32px;
    padding:18px;background:var(--shell);box-shadow:0 20px 60px rgba(0,0,0,.45);
  }
  @media (max-width:470px){
    .phone{margin:0;border:0;border-radius:0;padding:14px;min-height:100vh}
  }

  .header{display:flex;justify-content:space-between;align-items:center;gap:10px}
  .logo{font-size:26px;font-weight:700;letter-spacing:-.5px}
  .logo span{display:block;font-size:11px;font-weight:500;color:var(--dim2);letter-spacing:.3px}
  .status{display:flex;gap:6px;align-items:center;font-size:13px;color:var(--dim);
    background:var(--sunk);border:1px solid var(--line);padding:7px 11px;border-radius:999px;white-space:nowrap}
  .dot{width:9px;height:9px;border-radius:50%;background:var(--dim2);flex:none}
  .dot.ok{background:#22c55e} .dot.bad{background:#f87171} .dot.wait{background:#fbbf24}

  .card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;margin-top:14px}
  .small{font-size:12px;color:var(--dim);line-height:1.5}
  .big{font-size:22px;font-weight:700;margin-top:2px}
  .stats{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:12px}
  .stat{background:var(--sunk);padding:10px 6px;border-radius:12px;text-align:center}
  .stat .v{font-size:18px;font-weight:700;margin-top:2px}

  .chips{display:flex;gap:8px;overflow-x:auto;padding:14px 0 2px;-webkit-overflow-scrolling:touch;scrollbar-width:none}
  .chips::-webkit-scrollbar{display:none}
  .chip{padding:8px 14px;border-radius:999px;border:1px solid var(--line2);color:#aeb7c4;
    font-size:13px;white-space:nowrap;background:none;cursor:pointer;font-family:inherit}
  .chip .n{opacity:.6;margin-left:5px}
  .chip.active{background:var(--accent);color:#fff;border-color:var(--accent)}

  .contact{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px;margin-top:12px;
    cursor:pointer;transition:border-color .12s}
  .contact.sel{border-color:var(--accent)}
  .row{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
  .who{display:flex;gap:11px;align-items:flex-start;min-width:0}
  .tick{width:22px;height:22px;border-radius:7px;border:1.5px solid var(--line2);flex:none;margin-top:1px;
    display:flex;align-items:center;justify-content:center;font-size:13px;color:transparent}
  .contact.sel .tick{background:var(--accent);border-color:var(--accent);color:#fff}
  .name{font-weight:700;font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .badge{padding:5px 10px;border-radius:999px;font-size:11px;font-weight:600;white-space:nowrap;flex:none}
  .b-pending{background:#1e242e;color:#9aa4b2}
  .b-blocked{background:#3a1116;color:#fca5a5}
  .b-waiting_window{background:#3b2f08;color:#ffd166}
  .b-calling{background:#0e2a3d;color:#7dd3fc}
  .b-done{background:#14311f;color:#86efac}
  .b-review{background:#4a1d06;color:#fb923c}
  .b-no_answer{background:#23262d;color:#c2c8d2}
  .b-error{background:#3a1116;color:#fca5a5}
  .warn{margin-top:10px;background:#2c2310;color:#fcd34d;padding:9px 10px;border-radius:10px;font-size:12px;line-height:1.45}
  .why{margin-top:9px;background:var(--sunk);color:#cbd3de;padding:9px 10px;border-radius:10px;font-size:12px;line-height:1.45}

  .empty{text-align:center;padding:34px 16px}
  .empty h2{font-size:17px;margin:0 0 8px}
  .empty p{font-size:13px;color:var(--dim);line-height:1.6;margin:0 auto;max-width:290px}

  .btns{display:flex;gap:10px;margin-top:16px;flex-wrap:wrap}
  .btn{flex:1 1 0;min-width:130px;padding:13px;border-radius:14px;border:1px solid var(--line2);
    background:var(--sunk);color:var(--ink);font-size:14px;font-weight:600;font-family:inherit;cursor:pointer}
  .btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
  .btn:disabled{opacity:.45;cursor:not-allowed}

  .bottom{position:sticky;bottom:0;margin:18px -18px -18px;padding:14px 18px 20px;
    background:linear-gradient(to top,var(--shell) 72%,rgba(18,22,29,0));}
  @media (max-width:470px){ .bottom{margin:18px -14px 0;padding:14px 14px 22px} }
  .bar{background:var(--accent);border:0;border-radius:18px;padding:16px;width:100%;
    text-align:center;font-weight:700;font-size:15px;color:#fff;font-family:inherit;cursor:pointer}
  .bar:disabled{background:#1e242e;color:var(--dim2);cursor:not-allowed}
  .drylabel{display:flex;align-items:center;justify-content:center;gap:8px;margin-bottom:10px;
    font-size:12px;color:var(--dim)}
  .drylabel input{width:16px;height:16px;accent-color:var(--accent)}

  .footer{text-align:center;color:var(--dim2);font-size:11px;margin-top:14px;line-height:1.6}

  .veil{position:fixed;inset:0;background:rgba(4,6,10,.72);display:none;align-items:flex-end;
    justify-content:center;padding:14px;z-index:40}
  .veil.on{display:flex}
  .sheet{background:var(--shell);border:1px solid var(--line);border-radius:22px;padding:18px;
    width:100%;max-width:430px;max-height:86vh;overflow-y:auto}
  .sheet h3{margin:0 0 6px;font-size:17px}
  .kv{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-bottom:1px solid var(--line);font-size:13px}
  .kv:last-child{border-bottom:0}
  .kv .k{color:var(--dim);flex:none}
  .kv .v{text-align:right;word-break:break-word}
  textarea{width:100%;height:150px;background:var(--sunk);border:1px solid var(--line);border-radius:12px;
    color:var(--ink);padding:11px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px;resize:vertical}
  .note{font-size:12px;color:var(--dim);line-height:1.6}
</style>
</head>
<body>
<div class="phone">

  <div class="header">
    <div class="logo">SheetCall<span>CALL-E runtime</span></div>
    <div class="status"><span class="dot" id="dot"></span><span id="dotText">checking…</span></div>
  </div>

  <div class="card">
    <div class="small">This session</div>
    <div class="big" id="headline">No run yet</div>
    <div class="stats">
      <div class="stat"><div class="small">Calls</div><div class="v" id="sCalls">0</div></div>
      <div class="stat"><div class="small">Review</div><div class="v" id="sReview">0</div></div>
      <div class="stat"><div class="small">Avg conf.</div><div class="v" id="sConf">–</div></div>
    </div>
  </div>

  <div class="chips" id="chips"></div>
  <div id="list"></div>

  <div class="bottom">
    <div class="drylabel">
      <input type="checkbox" id="dry" checked>
      <label for="dry">Dry run — run the full machine, place no calls</label>
    </div>
    <button class="bar" id="bar" disabled>Select records to call</button>
  </div>

  <div class="footer">
    Host-agnostic runtime. This deployment uses the web adapter;<br>
    CALL-E's Calls API is authoritative for call state.
  </div>
</div>

<div class="veil" id="veil"><div class="sheet" id="sheet"></div></div>

<script>
(function () {
  'use strict';

  var STATE_ORDER = ['pending','blocked','waiting_window','calling','review','no_answer','done','error'];
  var LABEL = {
    pending:'Pending', blocked:'Blocked', waiting_window:'Waiting', calling:'Calling',
    done:'Done', review:'Review', no_answer:'No answer', error:'Error'
  };

  var S = {
    cfg: null,
    records: [],
    filter: 'all',
    sel: {},
    session: { calls: 0, review: 0, confSum: 0, confN: 0, lastDry: null }
  };

  var $ = function (id) { return document.getElementById(id); };
  var esc = function (s) {
    return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) {
      return { '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;' }[c];
    });
  };

  function mask(p) {
    p = String(p || '').trim();
    return p.length < 5 ? p : '•••• ' + p.slice(-4);
  }

  function save() {
    try { localStorage.setItem('sheetcall.records', JSON.stringify(S.records)); } catch (e) {}
  }
  function restore() {
    try {
      var raw = localStorage.getItem('sheetcall.records');
      if (raw) S.records = JSON.parse(raw) || [];
    } catch (e) { S.records = []; }
  }

  // ---- config -------------------------------------------------------------

  function loadConfig() {
    fetch('/api/config').then(function (r) { return r.json(); }).then(function (c) {
      S.cfg = c;
      var d = $('dot'), t = $('dotText');
      if (c.keyConfigured) { d.className = 'dot ok'; t.textContent = 'Key configured'; }
      else { d.className = 'dot bad'; t.textContent = 'No API key'; }
      render();
    }).catch(function () {
      $('dot').className = 'dot bad';
      $('dotText').textContent = 'Server unreachable';
    });
  }

  function regionMeta(code) {
    if (!S.cfg || !S.cfg.regions) return null;
    return S.cfg.regions[String(code || '').toUpperCase()] || null;
  }

  // ---- rendering ----------------------------------------------------------

  function counts() {
    var c = { all: S.records.length };
    S.records.forEach(function (r) {
      var st = r.state || 'pending';
      c[st] = (c[st] || 0) + 1;
    });
    return c;
  }

  function renderChips() {
    var c = counts(), html = '';
    html += '<button class="chip' + (S.filter === 'all' ? ' active' : '') +
            '" data-f="all">All<span class="n">' + c.all + '</span></button>';
    STATE_ORDER.forEach(function (st) {
      if (!c[st]) return;
      html += '<button class="chip' + (S.filter === st ? ' active' : '') + '" data-f="' + st + '">' +
              LABEL[st] + '<span class="n">' + c[st] + '</span></button>';
    });
    $('chips').innerHTML = html;
  }

  function renderList() {
    var list = $('list');
    if (!S.records.length) {
      list.innerHTML =
        '<div class="card empty">' +
          '<h2>No records loaded</h2>' +
          '<p>SheetCall calls a list of people who already expect to hear from you, ' +
          'and writes down what they actually said. Most rows should never become a call — ' +
          'that is the point.</p>' +
          '<div class="btns">' +
            '<button class="btn primary" id="bEx">Load example list</button>' +
            '<button class="btn" id="bCsv">Paste CSV</button>' +
          '</div>' +
        '</div>';
      $('bEx').onclick = loadExample;
      $('bCsv').onclick = openCsv;
      return;
    }

    var html = '';
    S.records.forEach(function (r, i) {
      var st = r.state || 'pending';
      if (S.filter !== 'all' && st !== S.filter) return;
      var m = regionMeta(r.region);
      var intl = m && m.line === 'International';
      var selected = !!S.sel[r.id];

      html += '<div class="contact' + (selected ? ' sel' : '') + '" data-i="' + i + '">' +
        '<div class="row">' +
          '<div class="who">' +
            '<div class="tick">✓</div>' +
            '<div style="min-width:0">' +
              '<div class="name">' + esc(r.name || r.id) + '</div>' +
              '<div class="small">' + esc(mask(r.phone_e164)) + '</div>' +
            '</div>' +
          '</div>' +
          '<div class="badge b-' + st + '">' + LABEL[st] + '</div>' +
        '</div>' +
        '<div class="small" style="margin-top:9px">' +
          esc(m ? m.country : (r.region || 'no region')) +
          (m ? ' · ' + m.line + ' line' : '') +
          (r.locale ? ' · ' + esc(r.locale) : '') +
        '</div>' +
        (r.reason ? '<div class="why">' + esc(r.reason) + '</div>' : '') +
        (intl ? '<div class="warn">International line — CALL-E documents these as primarily ' +
                'intended for testing. Answer rates may be lower than a local line.</div>' : '') +
      '</div>';
    });

    if (!html) html = '<div class="card empty"><p>Nothing in this filter.</p></div>';
    html += '<div class="btns">' +
              '<button class="btn" id="bEx2">Load example list</button>' +
              '<button class="btn" id="bCsv2">Paste CSV</button>' +
              '<button class="btn" id="bClr">Clear all</button>' +
            '</div>';
    list.innerHTML = html;
    if ($('bEx2')) $('bEx2').onclick = loadExample;
    if ($('bCsv2')) $('bCsv2').onclick = openCsv;
    if ($('bClr')) $('bClr').onclick = function () {
      S.records = []; S.sel = {}; save(); render();
    };
  }

  function renderBar() {
    var n = Object.keys(S.sel).filter(function (k) { return S.sel[k]; }).length;
    var b = $('bar');
    b.disabled = n === 0;
    if (!n) { b.textContent = 'Select records to call'; return; }
    b.textContent = ($('dry').checked ? 'Dry run' : 'Call') + ' selected (' + n + ')';
  }

  function renderSession() {
    var s = S.session;
    $('sCalls').textContent = s.calls;
    $('sReview').textContent = s.review;
    $('sConf').textContent = s.confN ? (s.confSum / s.confN).toFixed(2) : '–';
    if (!s.calls && !s.lastDry) $('headline').textContent = 'No run yet';
    else if (s.lastDry) $('headline').textContent = 'Dry run — no calls placed';
    else $('headline').textContent = s.calls + (s.calls === 1 ? ' call placed' : ' calls placed');
  }

  function render() { renderChips(); renderList(); renderBar(); renderSession(); }

  // ---- interaction --------------------------------------------------------

  document.addEventListener('click', function (e) {
    var chip = e.target.closest ? e.target.closest('.chip') : null;
    if (chip && chip.dataset.f) { S.filter = chip.dataset.f; render(); return; }

    var card = e.target.closest ? e.target.closest('.contact') : null;
    if (card) {
      var r = S.records[+card.dataset.i];
      if (!r) return;
      if (e.target.closest('.tick') || e.target.closest('.who')) {
        S.sel[r.id] = !S.sel[r.id];
        render();
      } else {
        openDetail(r);
      }
    }
  });

  $('dry').onchange = renderBar;
  $('veil').onclick = function (e) { if (e.target === $('veil')) closeSheet(); };

  function openSheet(html) { $('sheet').innerHTML = html; $('veil').classList.add('on'); }
  function closeSheet() { $('veil').classList.remove('on'); }
  window.closeSheet = closeSheet;

  function kv(k, v) {
    return '<div class="kv"><div class="k">' + esc(k) + '</div><div class="v">' + esc(v) + '</div></div>';
  }

  function openDetail(r) {
    var m = regionMeta(r.region);
    var h = '<h3>' + esc(r.name || r.id) + '</h3>' +
      '<div class="note">Only the last four digits are ever shown here. The full number goes to CALL-E and nowhere else.</div>' +
      '<div style="margin-top:12px">' +
      kv('State', LABEL[r.state || 'pending']) +
      (r.reason ? kv('Reason', r.reason) : '') +
      kv('Phone', mask(r.phone_e164)) +
      kv('Region', m ? m.country + ' (' + r.region + ')' : (r.region || '—')) +
      (m ? kv('CALL-E line', m.line) : '') +
      (m ? kv('Languages', m.languages.join(', ')) : '') +
      (r.locale ? kv('Locale', r.locale) : '') +
      (m ? kv('Local window', m.call_window_local[0] + '–' + m.call_window_local[1] + ' ' + m.timezone) : '') +
      kv('Attempts', r.attempt || 0) +
      (r.invoice_ref ? kv('Invoice', r.invoice_ref) : '') +
      (r.amount ? kv('Amount', r.amount) : '') +
      (r.due_date ? kv('Due', r.due_date) : '') +
      (r.confidence != null ? kv('Confidence', r.confidence) : '') +
      (r.evidence ? kv('Evidence', r.evidence) : '') +
      (r.source ? kv('Result source', r.source) : '') +
      '</div>' +
      '<div class="btns"><button class="btn primary" onclick="closeSheet()">Close</button></div>';
    openSheet(h);
  }

  function openCsv() {
    openSheet(
      '<h3>Paste CSV</h3>' +
      '<div class="note">First row must be the header. Recognised columns: ' +
      'id, name, phone_e164, region, locale, timezone, do_not_call, invoice_ref, amount, due_date, from_business.</div>' +
      '<div style="margin-top:12px"><textarea id="csv" placeholder="name,phone_e164,region,invoice_ref,amount,due_date&#10;Dana Reyes,+15550100001,US,INV-4471,1200.00,2026-08-28"></textarea></div>' +
      '<div class="btns"><button class="btn" onclick="closeSheet()">Cancel</button>' +
      '<button class="btn primary" id="csvGo">Load rows</button></div>'
    );
    $('csvGo').onclick = function () {
      var rows = parseCsv($('csv').value);
      if (!rows.length) { alert('No rows found.'); return; }
      rows.forEach(function (r, i) {
        if (!r.id) r.id = 'csv-' + (S.records.length + i + 1);
        r.attempt = Number(r.attempt || 0);
        S.records.push(r);
      });
      save(); closeSheet(); render();
    };
  }

  function parseCsv(text) {
    var lines = String(text || '').trim().split(/\r?\n/).filter(function (l) { return l.trim(); });
    if (lines.length < 2) return [];
    var head = lines[0].split(',').map(function (h) { return h.trim(); });
    return lines.slice(1).map(function (line) {
      var cells = line.split(','), o = {};
      head.forEach(function (h, i) { o[h] = (cells[i] || '').trim(); });
      return o;
    });
  }

  // ---- example list — every state is reachable -----------------------------

  function loadExample() {
    S.records = [
      { id:'ex1', name:'Dana Reyes',    phone_e164:'+15550100001', region:'US', locale:'en-US',
        invoice_ref:'INV-4471', amount:'1200.00', due_date:'2026-08-28', from_business:'Northwind Supply', attempt:0 },
      { id:'ex2', name:'Priya Nair',    phone_e164:'9876543210',   region:'IN', locale:'en-IN',
        invoice_ref:'INV-4472', amount:'45000.00', due_date:'2026-08-30', from_business:'Northwind Supply', attempt:0 },
      { id:'ex3', name:'Luc Tremblay',  phone_e164:'+15550100003', region:'CA', locale:'fr-CA',
        invoice_ref:'INV-4473', amount:'890.00', due_date:'2026-09-01', from_business:'Northwind Supply', attempt:0 },
      { id:'ex4', name:'Owen Whitfield', phone_e164:'+15550100004', region:'GB', locale:'en-GB',
        do_not_call:'yes', invoice_ref:'INV-4474', amount:'310.00', due_date:'2026-09-02', from_business:'Northwind Supply', attempt:0 },
      { id:'ex5', name:'Hala Mansour',  phone_e164:'+15550100005', region:'AE', locale:'ar-AE',
        invoice_ref:'INV-4475', amount:'2650.00', due_date:'2026-09-03', from_business:'Northwind Supply', attempt:0 },
      { id:'ex6', name:'Jonas Weber',   phone_e164:'+15550100006', region:'DE', locale:'de-DE',
        invoice_ref:'INV-4476', amount:'740.00', due_date:'2026-09-04', from_business:'Northwind Supply', attempt:0 }
    ];
    S.sel = {};
    S.records.forEach(function (r) { S.sel[r.id] = true; });
    save(); render();
  }

  // ---- run ----------------------------------------------------------------

  $('bar').onclick = function () {
    var dry = $('dry').checked;
    var chosen = S.records.filter(function (r) { return S.sel[r.id]; });
    if (!chosen.length) return;

    if (dry) { runCalls(chosen, true); return; }

    openSheet(
      '<h3>Place ' + chosen.length + ' real ' + (chosen.length === 1 ? 'call' : 'calls') + '?</h3>' +
      '<div class="note">These are real phone calls and they spend CALL-E credits. ' +
      'Rows that fail validation or fall outside the recipient\'s local calling window ' +
      'will still be stopped by the server before anything is dialled.</div>' +
      '<div class="btns"><button class="btn" onclick="closeSheet()">Cancel</button>' +
      '<button class="btn primary" id="go">Yes, call them</button></div>'
    );
    $('go').onclick = function () { closeSheet(); runCalls(chosen, false); };
  };

  function runCalls(records, dry) {
    var bar = $('bar');
    bar.disabled = true;
    bar.textContent = dry ? 'Running dry run…' : 'Placing calls…';

    fetch('/api/call', {
